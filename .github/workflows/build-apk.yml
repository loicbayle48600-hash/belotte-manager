name: Construire l'APK Android

# Compile l'application HACCP (Capacitor) en APK debug installable, puis publie
# le fichier sur la branche « apk-build » et comme artefact du run.
# La branche apk-build (qui ne contient que l'APK) ne porte pas ce fichier de
# workflow : la pousser ne redéclenche donc pas de build (pas de boucle).
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # Le paquet legacy « tools » (défaut de l'action) n'existe plus dans
          # les cmdline-tools récents des runners : ne demander que l'essentiel,
          # Gradle télécharge lui-même build-tools et platforms.
          packages: 'platform-tools'

      - name: Installer les dépendances Capacitor
        working-directory: mobile
        run: npm install --no-fund --no-audit

      - name: Copier l'application web et synchroniser Capacitor
        working-directory: mobile
        run: |
          bash sync-www.sh
          # Numéro de version embarqué (sert à la détection de mise à jour dans l'appli)
          printf 'window.APP_VERSION_CODE = %s;\nwindow.APP_VERSION_NAME = "1.%s";\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_NUMBER}" > www/version.js
          npx cap sync android

      - name: Compiler l'APK signé (clé fixe, mises à jour par-dessus garanties)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${GITHUB_RUN_NUMBER} -PappVersionName=1.${GITHUB_RUN_NUMBER}

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/haccp-cuisine.apk
          # Fichier consulté par les tablettes pour détecter une nouvelle version
          printf '{"versionCode": %s, "versionName": "1.%s"}\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_NUMBER}" > out/version.json
          ls -la out/

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: haccp-cuisine-apk
          path: out/haccp-cuisine.apk

      - name: Publier l'APK sur la branche apk-build
        run: |
          cd out
          git init -q
          git checkout -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haccp-cuisine.apk version.json
          git commit -q -m "APK HACCP compilé (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dépôt GitHub PRIVÉ : les tablettes ne peuvent plus lire la release ni
      # le fichier brut. Le build dépose donc aussi l'APK, le numéro de version
      # et le menu sur le Google Drive de l'établissement (via le script
      # Code.gs) — les tablettes se mettent à jour par là.
      - name: Publier aussi sur Google Drive (script Code.gs)
        run: |
          python3 - <<'EOF'
          import base64, glob, json, os, urllib.request
          # Un script (= une URL /exec) PAR ÉTABLISSEMENT ; tous reçoivent
          # l'APK, la version et le menu. Ajouter ici l'URL du déploiement
          # AET Laval dès qu'il existe.
          urls = [
              'https://script.google.com/macros/s/AKfycbxj5g6bW-hnOyhJNLlf65l04uYrZp9e2Pofo60F8ja1ijZcwFEG9Je1Kmd4jQVJildbjg/exec',  # EHPAD Grandrieu
          ]
          def envoyer(url, d):
              d.update({'app': 'haccp-cuisine', 'type': 'fichier-app', 'cle': 'haccp-maj-2026'})
              req = urllib.request.Request(url, data=json.dumps(d).encode(), headers={'Content-Type': 'text/plain;charset=utf-8'})
              print(d['quoi'], '->', urllib.request.urlopen(req, timeout=300).read()[:200])
          run = os.environ['GITHUB_RUN_NUMBER']
          apk = base64.b64encode(open('out/haccp-cuisine.apk', 'rb').read()).decode()
          menus = sorted(glob.glob('menus/*.xlsx'))
          menu = base64.b64encode(open(menus[0], 'rb').read()).decode() if menus else None
          for url in urls:
              try:
                  envoyer(url, {'quoi': 'apk', 'data': apk})
                  if menu:
                      envoyer(url, {'quoi': 'menu', 'data': menu})
                  # la version en DERNIER : les tablettes ne la voient qu'une fois l'APK en place
                  envoyer(url, {'quoi': 'version', 'texte': json.dumps({'versionCode': int(run), 'versionName': '1.' + run})})
              except Exception as e:
                  print('échec pour', url, ':', e)
          EOF
        continue-on-error: true

      # Release « apk » à lien stable : téléchargeable directement depuis la
      # tablette via https://github.com/<repo>/releases/latest
      - name: Publier l'APK en release GitHub
        run: |
          gh release delete apk --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git push -q --delete "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/apk 2>/dev/null || true
          gh release create apk out/haccp-cuisine.apk menus/*.xlsx \
            --repo "$GITHUB_REPOSITORY" \
            --title "📱 HACCP Cuisine — dernier APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "**haccp-cuisine.apk** : l'application Android à installer sur la tablette (installer par-dessus conserve les données).
          **menu-2025-ehpad-fam.xlsx** : le fichier des menus de l'année, à importer dans l'appli (module 🍲 Menu → 📥 Importer)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
