name: Construire l'APK Android

# Compile l'application HACCP (Capacitor) en APK debug installable, puis publie
# le fichier sur la branche « apk-build » et comme artefact du run.
# La branche apk-build (qui ne contient que l'APK) ne porte pas ce fichier de
# workflow : la pousser ne redéclenche donc pas de build (pas de boucle).
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances Capacitor
        working-directory: mobile
        run: npm install --no-fund --no-audit

      - name: Copier l'application web et synchroniser Capacitor
        working-directory: mobile
        run: |
          bash sync-www.sh
          npx cap sync android

      - name: Compiler l'APK debug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/haccp-cuisine.apk
          ls -la out/

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: haccp-cuisine-apk
          path: out/haccp-cuisine.apk

      - name: Publier l'APK sur la branche apk-build
        run: |
          cd out
          git init -q
          git checkout -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haccp-cuisine.apk
          git commit -q -m "APK HACCP compilé (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
