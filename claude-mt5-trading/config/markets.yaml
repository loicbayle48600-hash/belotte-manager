# Univers de marchés. Les noms sont des racines : le résolveur de suffixes broker
# trouve le symbole réel (EURUSD.m, EURUSD-, EURUSDmicro…) dans MT5.
markets:
  forex_majors: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD]
  forex_minors: [EURGBP, EURJPY, GBPJPY, EURAUD, EURCHF, AUDJPY, CADJPY, GBPAUD, AUDNZD, EURCAD]
  metals: [XAUUSD, XAGUSD]
  indices: [US500, US30, NAS100, GER40, UK100, JP225]
  energies: [USOIL, UKOIL, XTIUSD, XBRUSD]
  crypto: [BTCUSD, ETHUSD]
sessions:   # heures UTC
  ASIA:   {start: "00:00", end: "08:00"}
  LONDON: {start: "07:00", end: "16:00"}
  NEWYORK: {start: "12:00", end: "21:00"}
asset_class_rules:
  XAU: metals
  XAG: metals
  US500: indices
  US30: indices
  NAS100: indices
  GER40: indices
  UK100: indices
  JP225: indices
  OIL: energies
  XTI: energies
  XBR: energies
  BTC: crypto
  ETH: crypto
