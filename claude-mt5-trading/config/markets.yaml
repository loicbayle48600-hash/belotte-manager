markets:
  forex_majors: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD]
  # paires exotiques retirées le 2026-09-25 (demande utilisateur : « je ne veux plus, j'ai trop de pertes ») :
  # AUDSGD, CHFSGD, EURDKK, EURHKD, EURNOK, EURPLN, EURSEK, EURSGD, EURTRY, EURZAR, GBPDKK, GBPNOK, GBPSEK, GBPSGD, GBPTRY, NOKJPY, NOKSEK, SEKJPY, SGDJPY, USDCNH, USDCZK, USDDKK, USDHKD, USDHUF, USDMXN, USDNOK, USDPLN, USDSEK, USDSGD, USDTHB, USDTRY, USDZAR
  forex_minors: [AUDCAD, AUDCHF, AUDJPY, AUDNZD, CADCHF, CADJPY, CHFJPY, EURAUD, EURCAD, EURCHF,
                 EURGBP, EURJPY, EURNZD, GBPAUD, GBPCAD, GBPCHF, GBPJPY, GBPNZD, NZDCAD, NZDCHF,
                 NZDJPY]
  # Un seul couple par métal : XAUEUR, XAUJPY, XAUAUD, XAUCHF, XAUGBP, XAGEUR et XAGAUD
  # ont été RETIRÉS le 2026-09-21. Ce sont les mêmes deux métaux cotés dans une autre
  # devise : aucune diversification, seulement le même pari répété. Le bot avait ouvert
  # XAGUSD + XAGEUR + XAGAUD en 10 minutes et perdu 1 946 $ sur un seul mouvement.
  metals: [XAUUSD, XAGUSD, XPTUSD, XPDUSD]
  # USTEC = Nasdaq 100 et DE40 = DAX chez IC Markets (NAS100 / GER40 ailleurs)
  indices: [US500, US30, USTEC, DE40, UK100, JP225, AUS200, STOXX50,
            F40, CHINA50, ES35, HK50, IT40, US2000, CA60, NETH25,
            SE30, SWI20, CHINAH, SA40, NOR25, TecDE30, MidDE60, MidDE50]
  # spot uniquement : les contrats datés (WTI_X6, BRENT_M6, GCZ26_CFD…) expirent et
  # aucun agent ne gère le roulement — une position ouverte à l'échéance serait liquidée.
  energies: [XTIUSD, XBRUSD, XNGUSD]
  # 18 paires disponibles chez IC Markets (relevé 2026-09-20). Spreads relatifs de 0,02 %
  # (XRP) à 11 % (KSM) : max_spread_atr_ratio écarte les inexploitables.
  crypto: [BTCUSD, ETHUSD, XRPUSD, SOLUSD, BNBUSD, BCHUSD, LTCUSD, ADAUSD,
           DOGUSD, DOTUSD, XLMUSD, XTZUSD, UNIUSD, LNKUSD, AVXUSD, KSMUSD,
           POLUSD, DATAUSD]
