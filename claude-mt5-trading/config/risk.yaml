risk:
  # 2026-09-20, décisions explicites.
  # 1. Diversifier à budget de risque CONSTANT : 0,125 % par trade au lieu de 0,25 %.
  # 2. max_open_positions porté à 30. Le nombre d'emplacements et le budget de risque sont
  #    deux limites INDÉPENDANTES : chez IC Markets, `volume_max` plafonne 16 cryptos sur 18
  #    (XLM à 0,6 % de la taille visée, XRP à 4,5 %). Une position à 5 $ de risque consommait
  #    un emplacement entier pour 0,1 % du budget, et bloquait les autres pour rien.
  #    Les vrais plafonds restent max_total_open_risk_percent (1 %), le cluster corrélé (0,5 %,
  #    où toute la crypto tombe) et la classe d'actif (0,75 %) : 30 emplacements n'y changent
  #    rien. MAX_ENTRIES_PER_CYCLE=2 limite par ailleurs le rythme de remplissage.
  # 0.125 → 0.05 le 2026-09-23, TEMPORAIRE et sur demande explicite (« divise par deux ou par trois
  # pour le moment en mode test ») : lots ~2,5x plus petits → jusqu'à 20 positions simultanées au lieu
  # de 8 pour le MÊME budget de risque total (1 %). But : accumuler plus vite les échantillons par agent
  # (40 trades requis pour juger un agent) et voir lesquels tiennent. À REMETTRE à 0.125 avant tout
  # passage en réel — l'utilisateur dira quand.
  # 0.05 → 0.125 le 2026-09-24 sur demande explicite (« on peut augmenter comme avant et que ça reste sur les
  # règles de FOXX ») : retour à la valeur d'origine. Les règles FOXX restent appliquées par le gate (plafonds
  # de lots par classe, 2 % par idée, cohérence 25 %, 4 % / 8 %) ; les plafonds de concentration ci-dessous
  # sont déjà ceux calibrés pour 0.125.
  # 0.125 → 0.25 le 2026-09-24, décision utilisateur (option « Modéré ») : risque ouvert total et perte jour
  # interne portés à 2 %, plafonds de concentration et paliers après profit doublés (ratio constant). Reste
  # sous les règles FOXX (2 % par idée, 4 % par jour, 8 % au total) avec une marge de moitié.
  # 2026-09-28, TEMPORAIRE (décision utilisateur : « accélérer les 40 trades ») : 0,125 → 0,05 % (250 $ sur 500 000 $).
  # Plus de petites positions pour le même budget de perte total (1 %) ; les plafonds de concentration restent inchangés
  # EN % D'EQUITY (même argent exposé par cluster / devise / classe, composé de plus de tickets). À remettre à 0,125 à la
  # fin de la période de test — voir docs/SUIVI.md.
  risk_per_trade_percent: 0.05
  # 2026-09-28 au soir, décision utilisateur (revue par agents) : le forex a porté toute la perte des 8 derniers jours
  # (113 trades, −14 842 $, −0,18 R/trade, commission ≈ 5 % du risque) alors que crypto, indices, métaux sont positifs.
  # Risque par trade PLAFONNÉ par classe (%), tant que l'espérance forex reste négative. Vide = pas de plafond.
  risk_per_trade_by_class:
    forex: 0.025
  max_risk_per_trade_percent: 0.35
  max_daily_loss_internal_percent: 1.0  # retour à l'état du 23/09 (demande utilisateur 2026-09-25)
  max_total_open_risk_percent: 1.0  # retour à l'état du 23/09 (demande utilisateur 2026-09-25)
  max_open_positions: 30
  max_positions_per_symbol: 1
  # 2026-09-28, TEMPORAIRE (même décision) : 3 → 5. Le verrou à 3 pertes a fermé les entrées de 03 h 50 à 09 h 08 le
  # 28/09 (188 candidats refusés) ; avec des positions 2,5 fois plus petites, 5 pertes d'affilée coûtent 0,25 % au lieu
  # de 0,375 %. À remettre à 3 à la fin de la période de test.
  max_consecutive_losses: 5
  # Plancher de risque utile, en fraction de risk_per_trade_percent (0.2 = 20 % de la cible, soit 0,025 %).
  # Sous ce seuil, volume_max du broker a raboté la position au point qu'elle ne peut plus peser : le
  # 2026-09-21, XRPUSD a été pris deux fois à 11,52 $ et 12,10 $ de risque sur 500 000 $ tout en consommant
  # un emplacement et le quota d'une position par symbole. Ratio et non valeur absolue, pour suivre
  # risk_per_trade_percent sans dérive silencieuse au prochain ajustement.
  min_effective_risk_ratio: 0.2
  allow_martingale: false
  allow_grid: false
  allow_averaging_down: false
  allow_remove_sl: false
  allow_risk_increase_after_entry: false

correlation:
  # 2026-09-21 : plafonds DIVISÉS PAR DEUX en même temps que risk_per_trade_percent
  # (0,25 % -> 0,125 %). Ces limites sont exprimées en % de l'equity : les laisser
  # inchangées après avoir halvé le risque unitaire doublait mécaniquement le nombre de
  # positions corrélées autorisées (2 -> 4). Conséquence réelle : XAGUSD, XAGEUR et XAGAUD
  # — le MÊME métal — ouverts en 10 minutes, -1 946 $ au total. Le rapport
  # plafond / risque_par_trade doit rester constant.
  max_correlated_cluster_risk_percent: 0.25  # retour à l'état du 23/09 (demande utilisateur 2026-09-25)
  max_currency_factor_risk_percent: 0.3  # retour à l'état du 23/09 (demande utilisateur 2026-09-25)
  # 2026-09-21 soir, accord utilisateur (« fait tout ») : classe portée de 0,375 % (3 positions) à 0,5 %
  # (4 positions) — forex et indices saturaient tous deux leur plafond (≈ 190 refus en une après-midi)
  # alors que le budget total (1 %) restait loin d'être consommé. La hiérarchie est préservée :
  # cluster 2 < devise 2,4 < classe 4 < total 8 positions équivalentes.
  max_asset_class_risk_percent: 0.5  # retour à l'état du 23/09 (demande utilisateur 2026-09-25)
  correlation_threshold: 0.7
  lookback_bars: 200

profit_management:
  mode: ADAPTIVE_R_MANAGEMENT
  tp1_r: 1.5
  tp1_close_percent: 30
  tp2_r: 2.5
  tp2_close_percent: 40
  runner_percent: 30
  break_even_enabled: true
  # 1.2 → 1.0 le 2026-09-22 sur accord utilisateur : la nuit du 21 au 22, trois trades ont dépassé +0,9 R
  # avant de revenir au stop plein (-1 R) ; à 1,0 R deux d'entre eux auraient fini ~0. L'offset 0.05 reste.
  break_even_r: 1.0
  # true → false le 2026-09-22 sur accord utilisateur. L'exigence de structure neutralisait le break-even
  # à 1,0 R tant que TP1 (1,5 R) n'était pas pris : un trade qui plafonne entre 1,0 et 1,5 R ne déclenchait
  # RIEN et revenait au stop plein. Mesuré sur 54 trades : 4 cas, -1 895 $ (CADCHF -1,17 R après +1,11 R).
  break_even_requires_structure: false
  break_even_offset_r: 0.05
  trailing_enabled: true
  # 2.0 → 1.05 le 2026-09-25, demande utilisateur (« stop suiveur : quand ça passe en positif à 1,05, rester
  # toujours en bénéfice ») : le suivi démarre à +1,05 R, jamais sous le break-even (entrée + 0,05 R + commission)
  trailing_start_r: 1.05
  # 2026-09-28, demande utilisateur (« quand une position atteint +100 $, mettre directement le stop suiveur pour rester
  # en positif », puis « adapte : plus de positions avec moins de lots ») : seuil en FRACTION DU RISQUE INITIAL, pour
  # suivre la taille des lots — 0,16 R = 100 $ pour les 625 $ risqués au réglage de référence (0,125 %), soit 40 $ avec
  # le risque temporaire de 0,05 % ; vaut aussi chez les suiveurs. À ce seuil : break-even (entrée + 0,05 R + commission)
  # et stop suiveur armés, quel que soit le R. `protect_profit_money` : seuil absolu optionnel (0 = non utilisé).
  # 28/09 au soir, décision utilisateur « seuil plus haut » : 0,16 → 0,5 R. Mesuré de 18 h à 18 h 30 avec 0,16 R / verrou
  # 0,14 R : 7 trades protégés sur 8 coupés entre +0,02 et +0,13 R sur un simple retour du prix, aucun n'a pu courir.
  # 2026-10-01, décision utilisateur (« oui, mais 8 h ») : sortie des trades qui ne décollent pas. Un trade d'agent
  # M1 / M5 / M15 qui n'a JAMAIS atteint +0,2 R au bout de 8 h est fermé au marché (petite perte au lieu du stop plein).
  # Rejeu des candidats réels du 22/09 au 01/10 : la moitié des stops pleins venaient de trades jamais montés à +0,2 R ;
  # appliquée aux seuls agents M1-M15, sortie à 4 h comme à 8 h : +11,2 R au lieu de +10,5 R (153 trades), stops pleins 29 %
  # au lieu de 30 %, drawdown inchangé (9,8 R).
  no_progress_exit:
    enabled: true
    max_hours: 8
    min_r: 0.2
    timeframes: [M1, M5, M15]
  protect_profit_risk_ratio: 0.5
  # 2026-10-01, décision utilisateur (« oui ») : agents H1 seulement, protection à 1,0 R. Rejeu des 36 trades H1 réels du
  # 22/09 au 01/10 : +8,1 R au lieu de +1,7 R ; en contrepartie plus de perdants (34 % au lieu de 28 %), plus de stops
  # pleins (28 % au lieu de 19 %), drawdown 6,4 R au lieu de 5,1 R. Les autres agents gardent 0,5 R.
  protect_profit_risk_ratio_by_tf: {H1: 1.0}
  protect_profit_money: 0
  # Verrou : le plus haut de 0,25 R (minimum) et de la MOITIÉ du meilleur profit atteint (monte avec le trade). Une fois
  # à +0,5 R le trade ne peut plus finir en perte ; à +1,2 R il garde au moins 0,6 R. Si le niveau est trop près du prix
  # pour le broker, le stop se pose au plus près accepté, et le bot ferme lui-même au marché sous le verrou.
  protect_profit_lock_ratio: 0.25
  protect_profit_lock_fraction: 0.5
  trailing_atr_multiplier: 1.5
  trailing_use_market_structure: true
  never_widen_stop: true
  never_remove_stop: true
  allow_early_exit_on_invalidation: true
  regime_overrides:
    RANGING: {tp1_r: 1.0, tp1_close_percent: 50, tp2_r: 1.8, tp2_close_percent: 35, runner_percent: 15}
    NEWS_SHOCK: {block_new_entries: true}

# rollover des paires exotiques : règle ajoutée puis ANNULÉE le 2026-09-24 sur demande de l'utilisateur (code conservé,
# inactif sans section `rollover:`).

daily_profit:
  level_1_percent: 0.75
  level_1_new_risk_percent: 0.15
  level_1_setup_score_bonus: 5
  level_2_percent: 1.00
  level_2_new_risk_percent: 0.10
  level_2_setup_score_bonus: 10
  level_3_percent: 1.50
  level_3_new_risk_percent: 0.075
  level_3_setup_score_bonus: 15
  max_giveback_percent: 25
  # 2026-09-22, décision utilisateur finale (« continue normalement ») : en phase DEMO de collecte
  # d'échantillons, le plancher Giveback est JOURNALISÉ mais ne restreint rien — les réductions progressives
  # après bonne journée (levels 1-3 ci-dessus) restent seules à moduler le risque. Alternatives codées et
  # testées : "reduce_risk" (risque minimal giveback_risk_percent) et "lock" (gel historique, à remettre
  # pour le mode prop réel).
  giveback_action: "off"
  giveback_risk_percent: 0.05
