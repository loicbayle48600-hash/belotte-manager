account_expected:
  login: 53068680          # compte DÉMO maître depuis le 2026-09-24, Hedge, 500 000 USD (ancien 53060800 = « compte test 1 », archivé)
  server: "ICMarketsEU-Demo"
  trade_mode: DEMO
  currency: USD
  hedging: true
