[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab"
version = "1.0.0"
description = "Laboratoire de trading algorithmique multi-agents autonome relié à MetaTrader 5 (compte DEMO d'abord)."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "anthropic>=0.40",
  "mcp>=1.0",
  'MetaTrader5>=5.0.45; sys_platform == "win32"',
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
tradinglab = "tradinglab.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
